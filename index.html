<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f8068">
  <meta name="description" content="小学生が学年別に常用漢字の読み方と書き順を学べるサイトです。">
  <title>まなぶ漢字</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="hero" aria-labelledby="app-title">
      <div>
        <p class="eyebrow">小学生の学年別漢字</p>
        <h1 id="app-title">まなぶ漢字</h1>
        <p class="lead">学年をえらんで、読み方、画数、書き順をひとつずつ確認できます。スマホやタブレットのホーム画面にも追加できます。</p>
      </div>
      <div class="hero-visual" aria-hidden="true">
        <span>水</span>
        <span>森</span>
        <span>学</span>
      </div>
    </section>

    <section class="controls" aria-label="学習メニュー">
      <div class="grade-tabs" id="gradeTabs"></div>
      <label class="search">
        <span>さがす</span>
        <input id="searchInput" type="search" placeholder="漢字・読み・意味">
      </label>
    </section>

    <section class="workspace">
      <aside class="list-panel" aria-label="漢字一覧">
        <div class="panel-head">
          <h2 id="gradeTitle">1年生</h2>
          <p id="countText">読み込み中</p>
        </div>
        <div class="kanji-grid" id="kanjiGrid"></div>
      </aside>

      <section class="study-panel" aria-live="polite">
        <div class="card-top">
          <div>
            <p class="muted" id="gradeLabel">1年生</p>
            <div class="big-kanji" id="selectedKanji">一</div>
          </div>
          <div class="meter">
            <span id="strokeCount">1画</span>
            <small>画数</small>
          </div>
        </div>

        <div class="reading-grid">
          <article>
            <h3>音読み</h3>
            <p id="onReadings">イチ、イツ</p>
          </article>
          <article>
            <h3>訓読み</h3>
            <p id="kunReadings">ひと、ひと-つ</p>
          </article>
          <article>
            <h3>意味</h3>
            <p id="meanings">one</p>
          </article>
        </div>

        <div class="practice-area">
          <div class="stroke-card">
            <div class="tool-row">
              <h3>書き順</h3>
              <div>
                <button id="replayButton" type="button">再生</button>
                <button id="traceButton" type="button">なぞる</button>
              </div>
            </div>
            <div class="stroke-stage" id="strokeStage">
              <svg id="strokeSvg" viewBox="0 0 109 109" role="img" aria-label="書き順">
                <text x="54.5" y="70" text-anchor="middle">一</text>
              </svg>
              <canvas id="traceCanvas" width="520" height="520" style="display: none;"></canvas>
            </div>
          </div>

          <div class="quiz-card">
            <div class="tool-row">
              <h3>ミニ確認</h3>
              <button id="nextQuizButton" type="button">次へ</button>
            </div>
            <p id="quizQuestion">「ひとつ」と読む漢字は？</p>
            <div class="quiz-options" id="quizOptions"></div>
            <p class="feedback" id="quizFeedback"></p>
          </div>
        </div>
      </section>
    </section>

    <footer>
      こども用の学習サイトです。ログイン、広告、入力した内容の送信はありません。漢字一覧・音訓は kanjiapi.dev、書き順 SVG は KanjiVG（CC BY-SA 3.0）を利用できる設計です。
    </footer>
  </main>

  <script src="kanji-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
